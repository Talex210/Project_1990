# Project 1990 — bonus catalog (phase 3.1). Data-driven defs; code only interprets.
# Format: [id] sections, key=value. # comments.
# who=player | enemy | both
# duration_secs=0 → instant (or permanent until a cancel event)
# effects: comma list of EffectName (see docs/BONUSES.md)
# cancel: death | level_end | (empty)
# exclusive_group: picking another bonus in the same group replaces the previous
# name: short label for HUD / readability
#
# Forest clear is NOT a letter: unlocks at ★4 or the 2nd Gun (P).
# Ship (B) has no timer — lasts across stages until an enemy bullet hits you.

# Every Nth spawned enemy is a flashing bonus carrier (1 = every enemy — test-friendly).
# Tune higher on later balance passes.
drop_every_kills=1
pickup_lifetime_secs=18

[helmet]
letter=H
name=Helmet
who=both
duration_secs=10
effects=Invuln
cancel=death,level_end
score=500
exclusive_group=protect

[clock]
letter=C
name=Clock
who=both
# Classic NES ~10s; we use 4s (enemy clock on the player feels long at classic length).
duration_secs=4
effects=FreezeOpponents
cancel=level_end
score=500
exclusive_group=tempo

[shovel]
letter=L
name=Shovel
who=both
duration_secs=20
effects=FortifyBase
cancel=level_end
score=500
exclusive_group=base_walls

[grenade]
letter=G
name=Grenade
who=both
duration_secs=0
effects=KillOpponents
cancel=
score=500

[star]
letter=*
name=Star
who=both
duration_secs=0
effects=TankUpgrade
cancel=death
score=500
max_stacks=4

[gun]
letter=P
name=Gun
who=both
duration_secs=0
effects=MaxUpgrade
cancel=death
score=500

[tank]
letter=T
name=Life
who=player
duration_secs=0
effects=ExtraLife
cancel=
score=500

[ship]
letter=B
name=Ship
who=both
duration_secs=0
effects=WaterWalk
cancel=death
score=500
